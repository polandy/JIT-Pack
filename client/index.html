<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JIT-Pack</title>
    <!-- Installable PWA (NFR-4.13): manifest + the Apple half, which reads
         its own tags rather than the manifest. The icon is full-bleed — iOS
         rounds it itself and paints transparency black. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="JIT-Pack" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Mirrors --ct-base (Nacht, the dark default); theme.ts retargets it to
         the flavour's own base after boot, reading the token rather than
         repeating it (invariant 9). -->
    <meta name="theme-color" content="#1b2327" />
    <script>
      // FR-21.4: apply the persisted theme before first paint — the
      // stylesheet defaults to dark (Nacht), so only Tag needs a tag. 'latte'
      // is the value a device persisted before ADR-048 (see theme.ts).
      try {
        var t = localStorage.getItem('jitpack_theme')
        if (t === 'day' || t === 'latte')
          document.documentElement.classList.add('jitpack-day')
      } catch (e) {
        /* storage unavailable → dark default */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
