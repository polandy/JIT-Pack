site_name: JIT-Pack
site_description: Self-hosted, offline-first packing lists — dynamic quantities, real-time collaboration, your data on your server
site_url: https://polandy.github.io/JIT-Pack/
repo_url: https://github.com/polandy/JIT-Pack
repo_name: polandy/JIT-Pack
edit_uri: edit/main/docs/
copyright: JIT-Pack

theme:
  name: material
  logo: assets/mark.svg
  favicon: assets/mark.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    # Catppuccin Latte / Mocha are the app's own themes; blue is its primary
    # accent (--ct-blue), so the manual reads as part of the same product.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started:
      - Walkthrough: getting-started.md
      - Installation: installation.md
      - Configuration: configuration.md
  - Operating:
      - Authentication: authentication.md
      - Family Setup: family-setup.md
      - User Management: user-management.md
      - Notifications & Push: notifications.md
      - Backup & Export: backup.md
      - Upgrades: upgrades.md
      - Troubleshooting: troubleshooting.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
  - tables

plugins:
  - search

validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
