<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" fill="none">
  <!-- JIT-Pack brand lockup for dark backgrounds: the "Packed Backpack" mark
       on its Mocha tile (the tile is theme-independent artwork), wordmark in
       Catppuccin Mocha text with a Mocha lavender dot. -->
  <g transform="scale(0.125)">
    <rect width="512" height="512" rx="118" fill="#1e1e2e"/>
    <rect x="156" y="128" width="96" height="72" rx="18" fill="#94e2d5"/>
    <rect x="268" y="112" width="80" height="88" rx="18" fill="#fab387"/>
    <rect x="136" y="196" width="240" height="220" rx="52" fill="none" stroke="#b4befe" stroke-width="32" stroke-linejoin="round"/>
    <path d="M180 414 V348 q0 -26 26 -26 h100 q26 0 26 26 v66" fill="none" stroke="#b4befe" stroke-width="24" stroke-linejoin="round" stroke-linecap="butt"/>
  </g>
  <text x="78" y="42" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#cdd6f4">JIT</tspan><tspan fill="#b4befe">·</tspan><tspan fill="#cdd6f4">Pack</tspan>
  </text>
