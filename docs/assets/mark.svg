  <rect x="268" y="112" width="80" height="88" rx="18" fill="#fab387"/>
  <rect x="136" y="196" width="240" height="220" rx="52" fill="none" stroke="#b4befe" stroke-width="32" stroke-linejoin="round"/>
  <path d="M180 414 V348 q0 -26 26 -26 h100 q26 0 26 26 v66" fill="none" stroke="#b4befe" stroke-width="24" stroke-linejoin="round" stroke-linecap="butt"/>
