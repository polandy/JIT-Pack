<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" fill="none">
  <!-- JIT-Pack brand lockup for light backgrounds: the "Packed Backpack" mark
       on its Nacht tile (the tile is theme-independent artwork), wordmark in
       Tag text with a Tag lupine dot. -->
  <g transform="scale(0.125)">
    <rect width="512" height="512" rx="118" fill="#1b2327"/>
    <rect x="156" y="128" width="96" height="72" rx="18" fill="#5faf9f"/>
    <rect x="268" y="112" width="80" height="88" rx="18" fill="#f0a44e"/>
    <rect x="136" y="196" width="240" height="220" rx="52" fill="none" stroke="#9fb0e8" stroke-width="32" stroke-linejoin="round"/>
    <path d="M180 414 V348 q0 -26 26 -26 h100 q26 0 26 26 v66" fill="none" stroke="#9fb0e8" stroke-width="24" stroke-linejoin="round" stroke-linecap="butt"/>
  </g>
  <text x="78" y="42" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#1e2427">JIT</tspan><tspan fill="#4c5fb5">·</tspan><tspan fill="#1e2427">Pack</tspan>
  </text>
</svg>
