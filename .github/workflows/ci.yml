name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a feature branch be checked on GitHub without opening a PR first, so
  # the jobs that need docker and a browser (e2e, visual, docker-build) never
  # have to run on a maintainer laptop. `make ci-remote` is the front door.
  # Note this trigger is only honoured once it exists on the default branch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Scoped, not ./... — see the GO_PKGS comment in the Makefile: an
      # installed client/node_modules puts third-party Go source in the
      # module tree. CI has no node_modules, but the two must not diverge.
      - run: go build ./cmd/... ./internal/...
      - run: go vet ./cmd/... ./internal/...
      # Before the tests, because a contract the client has not followed is a
      # cheaper failure to read than whatever it breaks downstream (NFR-4.14).
      - name: Check the client's wire types match the contract
        run: ./scripts/wire-contract-gate.sh
      - run: go test ./cmd/... ./internal/... -race -count=1 -coverprofile=coverage.txt
      # Thresholds live in the script, so `make cover` enforces the same ones.
      - name: Enforce coverage gates (working agreement)
        run: ./scripts/coverage-gate.sh coverage.txt
      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # The package scripts lint with --fix for local use; CI only checks.
      - run: npx oxlint .
      - run: npx eslint .
      # Invariant 9b: colour, radius and elevation come from the three
      # token tables, never from a view. Node built-ins only.
      - run: node ../scripts/design-tokens-gate.mjs
      # FR-28.6: the curated mark index, the emoji subset and the CSS
      # unicode-range are one decision in three files; an index entry outside
      # the subset renders as tofu on every device.
      - run: node ../scripts/mark-font-gate.mjs
      - run: npm run build # runs type-check and the production build
      # The dev seed, the M14 fixture and the gallery must be *absent* from the
      # bundle, not merely hidden in it — a `v-if` leaves the code behind the
      # trigger. Reads what the build above emitted, so it runs after it.
      - run: node ../scripts/dev-code-gate.mjs
      # Not a client check, but this is the job that has node and no install
      # step to pay for: the implementation log's index must name every
      # section, because it is meant to be read instead of the log.
      - run: node ../scripts/log-index-gate.mjs
      # Same job, same reason: a UI-Test-Spec id that carries two different
      # promises makes a green test read as coverage of the one nobody wrote.
      - run: node ../scripts/case-id-gate.mjs
      # Same reason, and the file it guards ships in the client image: a
      # reverse proxy that drops the port from Host refuses every WebSocket
      # handshake while the whole REST surface stays green.
      - run: node ../scripts/proxy-host-gate.mjs
      - run: npx vitest run

  # Visual baselines (ADR-013). Runs the tests *inside* the digest-pinned
  # Playwright image rather than on the runner, which is the whole point:
  # the maintainer regenerates baselines locally in the same image, so the
  # two render in the same userland and a diff means a design change rather
  # than a font-hinting difference. That is also why this job looks unlike
  # the `e2e` job above — the inconsistency is deliberate and ADR-013 owns it.
  #
  # Not a required check: it `needs` the client build, and a skipped
  # required check blocks a PR with a less useful message than the build
  # failure itself. (The `needs` stays here, unlike on `e2e`, because this
  # job is off the critical path either way — it finishes well inside the
  # e2e window.)
  visual:
    needs: [client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build # the visual project drives the built bundle
        working-directory: client
      # The same script `make visual` runs, called directly: `make` itself
      # would fail here on its parse-time toolchain guard, which wants
      # golangci-lint — a tool the baselines do not use.
      - run: scripts/visual.sh
      # The actual-vs-expected images, so a red run can be judged without
      # reproducing it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: visual-diff
          path: client/test-results/
          retention-days: 7

  # Headless-browser E2E (dev-docs/UI_Test_Spec_v1.0.md). Drives the built
  # client (vite preview) in Chromium + WebKit. The backend-backed modes
  # (single/server) and their jitpackd harness land in later milestones, so
  # this currently exercises the backend-free smoke path only.
  #
  # Deliberately *not* gated on `client` (it was, until 2026-08-19): the job
  # installs and builds on its own runner anyway — with a warm npm cache that
  # is ~20 s, and a broken build fails right there — so the gate reused
  # nothing and only serialized ~75 s of `client` onto the front of the
  # slowest job in the pipeline. The cost of the trade is runner minutes,
  # not signal: on a commit where `client` fails lint but builds, the e2e
  # legs now run to completion instead of being skipped.
  #
  # Runs inside the digest-pinned Playwright image, like the `visual` job and
  # for a blunter reason: `playwright install --with-deps` was 1124 s of a
  # 1776 s job. The browser binaries cached fine; WebKit's ~200 apt libraries
  # are not cacheable and were reinstalled on every run. The image has them.
  #
  # Split by Playwright's own sharding rather than one leg per browser, which
  # was the first attempt and measurably worse. Measured locally inside the
  # image, 2 workers: Chromium 3.8 min, WebKit 10.6 min. A per-browser split
  # is therefore bounded by WebKit for its whole duration while the Chromium
  # runner idles for seven minutes, and it puts two WebKit contexts on one
  # runner where roughly one ran before — which is how a suite whose slowest
  # passing WebKit unit already took 31.9 s starts failing. Not more workers
  # per runner either: a runner has 4 vCPU and Playwright already takes 2.
  #
  # Four shards, sized from the 2026-08-19 CI reports: the suite carries
  # ~1020 test-seconds, and with `fullyParallel` Playwright splits the test
  # list into contiguous count-equal chunks — WebKit (~630 s) sits behind
  # Chromium (~350 s) in that list, so the split is uneven by duration.
  # Simulated on the real durations: 2 shards land 464/557 s, 4 shards land
  # 150/315/251/305 s. The worst leg drops from ~4.7 min of test time to
  # ~2.6, against ~1 min of fixed cost per leg (image pull ~36 s, npm ci +
  # build ~25 s warm). More shards pay that fixed cost again for less than
  # a minute back.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports, so a failure in one is not hidden by the
      # others being cancelled.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      # Installed and built on the *runner*, not in the container: the image
      # ships its own Node, and the bundle under test must be the one the
      # `client` job's toolchain produces.
      - run: npm ci
        working-directory: client
      - run: npm run build # vite preview serves this bundle
        working-directory: client
      # job-total rather than a repeated literal: the shard count is the
      # matrix length, and naming it twice is how the two drift apart.
      - run: scripts/e2e.sh --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          # Unique per leg — a repeated artifact name is an upload error.
          name: playwright-report-shard-${{ matrix.shard }}
          path: client/playwright-report/
          retention-days: 7

  # Backend-backed e2e (UI-Test-Spec §2.2, mode `single`): a real jitpackd in
  # Single-User configuration behind the preview proxy, the client in its
  # `server` mode. Its own job rather than a fifth shard because the shard
  # legs never see these tests: the `single` project only exists under
  # E2E_BACKEND (playwright.config.ts), which needs the Go binary the shard
  # legs deliberately do not build. Same pinned image, same drift check, via
  # scripts/e2e.sh. Not a required check, for the same reasons `e2e` is not
  # (see CLAUDE.md — branch protection stays untouched).
  e2e-single:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      # Built on the runner, run inside the container off the repo mount —
      # CGO_ENABLED=0 keeps it static (D-001), because a cgo build links the
      # build host's dynamic loader, which the container may not have.
      - run: CGO_ENABLED=0 go build -o jitpackd-e2e ./cmd/jitpackd
      - run: npm ci
        working-directory: client
      - run: npm run build # vite preview serves this bundle
        working-directory: client
      - run: E2E_BACKEND=1 scripts/e2e.sh --project=single
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-single
          path: client/playwright-report/
          retention-days: 7

  # Multi-identity e2e (UI-Test-Spec §2.3, mode `server`): the same binary in
  # OIDC mode against the mock IdP fixture in client/e2e/server/, driven by
  # two browser contexts logged in as two different accounts. Its own job for
  # the same reason `e2e-single` is one, and separate from it because the two
  # backend configurations are mutually exclusive in one process —
  # Single-User bypasses auth entirely. Not a required check either.
  e2e-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: CGO_ENABLED=0 go build -o jitpackd-e2e ./cmd/jitpackd
      - run: npm ci
        working-directory: client
      - run: npm run build # vite preview serves this bundle
        working-directory: client
      - run: E2E_SERVER=1 scripts/e2e.sh --project=server
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-server
          path: client/playwright-report/
          retention-days: 7

  # Formats Go (gofmt) and the client (prettier) and pushes the fixes back,
  # so formatting is never a red build — it just gets applied. Skipped for
  # fork PRs, where GITHUB_TOKEN cannot push to the head branch.
  autoformat:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: gofmt -w cmd internal
      - run: npm ci
        working-directory: client
      - run: npm run format
        working-directory: client
      - name: Commit formatting fixes
        run: |
          if git diff --quiet; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "style: apply automatic formatting"
          git push

  # Verifies both images still build on every change; docker.yml only
  # builds and pushes on release tags (backend + client, same matrix).
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Before building: a build-image major bumped on its own would pass both
      # builds and ship a bundle no other job ever compiled (see the script).
      - run: ./scripts/toolchain-pins-gate.sh
      - run: docker build .
      - run: docker build client

  # Merges patch/minor Dependabot PRs once every check above is green.
  # Branch protection with required status checks is unavailable on a
  # free-plan private repo, so the gate lives here instead: `needs` makes
  # the merge wait for green by construction. Major updates stay open
  # for manual review.
  dependabot-merge:
    needs: [go, go-lint, client, visual, e2e, e2e-single, e2e-server, docker-build]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        id: metadata
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
