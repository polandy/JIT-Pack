name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      # Scoped, not ./... — see the GO_PKGS comment in the Makefile: an
      # installed client/node_modules puts third-party Go source in the
      # module tree. CI has no node_modules, but the two must not diverge.
      - run: go build ./cmd/... ./internal/...
      - run: go vet ./cmd/... ./internal/...
      - run: go test ./cmd/... ./internal/... -race -count=1 -coverprofile=coverage.txt
      # Thresholds live in the script, so `make cover` enforces the same ones.
      - name: Enforce coverage gates (working agreement)
        run: ./scripts/coverage-gate.sh coverage.txt
      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # The package scripts lint with --fix for local use; CI only checks.
      - run: npx oxlint .
      - run: npx eslint .
      - run: npm run build # runs type-check and the production build
      - run: npx vitest run

  # Headless-browser E2E (docs/UI_Test_Spec_v1.0.md). Drives the built
  # client (vite preview) in Chromium + WebKit. Gated after `client` so
  # it only runs on a green build; the backend-backed modes (single/
  # server) and their jitpackd harness land in later milestones, so this
  # currently exercises the backend-free smoke path only.
  e2e:
    needs: [client]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # Cache the browser binaries; the key follows the lockfile, so a
      # Dependabot @playwright/test bump invalidates it automatically.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}
      # `install` skips already-cached browsers; --with-deps still ensures
      # the apt system libraries each run (cheap, not cached).
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build # vite preview serves this bundle
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7

  # Formats Go (gofmt) and the client (prettier) and pushes the fixes back,
  # so formatting is never a red build — it just gets applied. Skipped for
  # fork PRs, where GITHUB_TOKEN cannot push to the head branch.
  autoformat:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: gofmt -w cmd internal
      - run: npm ci
        working-directory: client
      - run: npm run format
        working-directory: client
      - name: Commit formatting fixes
        run: |
          if git diff --quiet; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "style: apply automatic formatting"
          git push

  # Verifies the image still builds on every change; docker.yml only
  # builds and pushes on release tags.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build .

  # Merges patch/minor Dependabot PRs once every check above is green.
  # Branch protection with required status checks is unavailable on a
  # free-plan private repo, so the gate lives here instead: `needs` makes
  # the merge wait for green by construction. Major updates stay open
  # for manual review.
  dependabot-merge:
    needs: [go, go-lint, client, e2e, docker-build]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        id: metadata
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
