name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a feature branch be checked on GitHub without opening a PR first, so
  # the jobs that need docker and a browser (e2e, visual, docker-build) never
  # have to run on a maintainer laptop. `make ci-remote` is the front door.
  # Note this trigger is only honoured once it exists on the default branch.
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same PR makes the first run's verdict worthless, but it
# goes on holding runners — and with the e2e matrix a run is 16 jobs against
# the 20 a public repo may have in flight, so an abandoned run does not merely
# waste minutes, it queues the run that replaced it.
#
# Superseding is deliberately limited to pull requests. A `push` to main is the
# commit that ships: its run is the record that main was green, and two pushes
# landing close together must both be checked rather than the older one being
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Scoped, not ./... — see the GO_PKGS comment in the Makefile: an
      # installed client/node_modules puts third-party Go source in the
      # module tree. CI has no node_modules, but the two must not diverge.
      - run: go build ./cmd/... ./internal/...
      - run: go vet ./cmd/... ./internal/...
      # Before the tests, because a contract the client has not followed is a
      # cheaper failure to read than whatever it breaks downstream (NFR-4.14).
      - name: Check the client's wire types match the contract
        run: ./scripts/wire-contract-gate.sh
      - run: go test ./cmd/... ./internal/... -race -count=1 -coverprofile=coverage.txt
      # Thresholds live in the script, so `make cover` enforces the same ones.
      - name: Enforce coverage gates (working agreement)
        run: ./scripts/coverage-gate.sh coverage.txt
      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/client-setup
      # The package scripts lint with --fix for local use; CI only checks.
      - run: npx oxlint .
      - run: npx eslint .
      # Invariant 9b: colour, radius and elevation come from the three
      # token tables, never from a view. Node built-ins only.
      - run: node ../scripts/design-tokens-gate.mjs
      # FR-28.6: the curated mark index, the emoji subset and the CSS
      # unicode-range are one decision in three files; an index entry outside
      # the subset renders as tofu on every device.
      - run: node ../scripts/mark-font-gate.mjs
      - run: npm run build # runs type-check and the production build
      # The dev seed, the M14 fixture and the gallery must be *absent* from the
      # bundle, not merely hidden in it — a `v-if` leaves the code behind the
      # trigger. Reads what the build above emitted, so it runs after it.
      - run: node ../scripts/dev-code-gate.mjs
      # Not a client check, but this is the job that has node and no install
      # step to pay for: the implementation log's index must name every
      # section, because it is meant to be read instead of the log.
      - run: node ../scripts/log-index-gate.mjs
      # Same job, same reason: a specification paragraph written on one
      # 7 000-character line renders perfectly and defeats every way the file
      # is actually read — `grep -n`, a partial read, a two-word diff.
      - run: node ../scripts/spec-width-gate.mjs
      # Same job, same reason: a UI-Test-Spec id that carries two different
      # promises makes a green test read as coverage of the one nobody wrote.
      - run: node ../scripts/case-id-gate.mjs
      # Same reason, and the file it guards ships in the client image: a
      # reverse proxy that drops the port from Host refuses every WebSocket
      # handshake while the whole REST surface stays green.
      - run: node ../scripts/proxy-host-gate.mjs
      # Same job again: a spec that re-declares a shared helper gets a copy
      # that drifts in its waits, and the e2e jobs cannot see that — they run
      # both copies and both pass, until one of them stops.
      - run: node ../scripts/e2e-helpers-gate.mjs
      # And once more: an absence asserted against a test id the app never
      # declared is green whatever the app does, and the e2e jobs cannot see
      # it — the locator they run finds nothing, which is what was claimed.
      - run: node ../scripts/testid-gate.mjs
      - run: npx vitest run

  # Visual baselines (ADR-013). Runs the tests *inside* the digest-pinned
  # Playwright image rather than on the runner, which is the whole point:
  # the maintainer regenerates baselines locally in the same image, so the
  # two render in the same userland and a diff means a design change rather
  # than a font-hinting difference. That is also why this job looks unlike
  # the `e2e` job above — the inconsistency is deliberate and ADR-013 owns it.
  #
  # Not a required check: it `needs` the client build, and a skipped
  # required check blocks a PR with a less useful message than the build
  # failure itself. (The `needs` stays here, unlike on `e2e`, because this
  # job is off the critical path either way — it finishes well inside the
  # e2e window.)
  visual:
    needs: [client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/client-setup
        with:
          build: 'true'
      # The same script `make visual` runs, called directly: `make` itself
      # would fail here on its parse-time toolchain guard, which wants
      # golangci-lint — a tool the baselines do not use.
      - run: scripts/visual.sh
      # The actual-vs-expected images, so a red run can be judged without
      # reproducing it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: visual-diff
          path: client/test-results/
          retention-days: 7

  # Headless-browser E2E (dev-docs/UI_Test_Spec_v1.0.md). Drives the built
  # client (vite preview) in Chromium + WebKit, Local Mode only — the
  # backend-backed modes have had their own jobs since #192 (`e2e-single`,
  # `e2e-server`, both below).
  #
  # The shard count is a *measurement*, not a constant: eight, sized
  # 2026-08-30 against ~1920 test-seconds. Why eight and not four or twelve —
  # the per-browser split that was worse, the fixed ~60 s per leg, the 20-job
  # concurrency ceiling — is in dev-docs/implementation-log.md, "Why the e2e
  # matrix is eight legs". **Re-read the number when the suite grows**: a
  # green pipeline never says the count has gone stale, because the only
  # symptom is that every run is slower than it needs to be. The cheap check
  # is the per-leg times of any recent run.
  #
  # Deliberately *not* gated on `client`, and it runs inside the digest-pinned
  # Playwright image rather than installing browsers — both measured, both in
  # that same log section.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports, so a failure in one is not hidden by the
      # others being cancelled.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Installed and built on the *runner*, not in the container: the image
      # ships its own Node, and the bundle under test must be the one the
      # `client` job's toolchain produces.
      - uses: ./.github/actions/client-setup
        with:
          build: 'true'
      # job-total rather than a repeated literal: the shard count is the
      # matrix length, and naming it twice is how the two drift apart.
      - run: scripts/e2e.sh --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          # Unique per leg — a repeated artifact name is an upload error.
          name: playwright-report-shard-${{ matrix.shard }}
          path: client/playwright-report/
          retention-days: 7

  # Backend-backed e2e (UI-Test-Spec §2.2, mode `single`): a real jitpackd in
  # Single-User configuration behind the preview proxy, the client in its
  # `server` mode. Its own job rather than a fifth shard because the shard
  # legs never see these tests: the `single` project only exists under
  # E2E_BACKEND (playwright.config.ts), which needs the Go binary the shard
  # legs deliberately do not build. Same pinned image, same drift check, via
  # scripts/e2e.sh. Not a required check, for the same reasons `e2e` is not
  # (see CLAUDE.md — branch protection stays untouched).
  e2e-single:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Built on the runner, run inside the container off the repo mount —
      # CGO_ENABLED=0 keeps it static (D-001), because a cgo build links the
      # build host's dynamic loader, which the container may not have.
      - run: CGO_ENABLED=0 go build -o jitpackd-e2e ./cmd/jitpackd
      - uses: ./.github/actions/client-setup
        with:
          build: 'true'
      - run: E2E_BACKEND=1 scripts/e2e.sh --project=single
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-single
          path: client/playwright-report/
          retention-days: 7

  # Multi-identity e2e (UI-Test-Spec §2.3, mode `server`): the same binary in
  # OIDC mode against the mock IdP fixture in client/e2e/server/, driven by
  # two browser contexts logged in as two different accounts. Its own job for
  # the same reason `e2e-single` is one, and separate from it because the two
  # backend configurations are mutually exclusive in one process —
  # Single-User bypasses auth entirely. Not a required check either.
  e2e-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go build -o jitpackd-e2e ./cmd/jitpackd
      - uses: ./.github/actions/client-setup
        with:
          build: 'true'
      - run: E2E_SERVER=1 scripts/e2e.sh --project=server
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-server
          path: client/playwright-report/
          retention-days: 7

  # Checks formatting instead of applying it (ADR-040). This job used to run
  # gofmt and prettier with --write and push a `style:` commit back onto the
  # branch, which cost more than the convenience was worth: the bot's push is
  # attributed to github-actions[bot] and its run arrives `action_required`,
  # so `gh pr checks` reports *no checks at all* and the PR sits at BLOCKED —
  # not red, not pending, blank, with nothing on screen saying that manually
  # approving the run is what it wants.
  #
  # The same two commands run in `make ci` (fmt-check and client-fmt), so the
  # failure this job can produce is one the author has already been shown
  # locally, with `make fmt` as its fix.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/client-setup
      # `gofmt -l` exits 0 even when files need formatting, so the emptiness
      # of its output is the assertion — same shape as the Makefile target.
      - name: Check Go formatting
        run: |
          if [ -n "$(gofmt -l cmd internal)" ]; then
            echo "gofmt needed — run \`make fmt\`:"
            gofmt -l cmd internal
            exit 1
          fi
      - name: Check client formatting
        run: npx prettier --check --experimental-cli src/ e2e/
        working-directory: client

  # Verifies the image still builds on every change; docker.yml only builds
  # and pushes it on release tags. One image since ADR-043 — the binary
  # serves the client from the same origin.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Before building: a build-image major bumped on its own would pass both
      # builds and ship a bundle no other job ever compiled (see the script).
      - run: ./scripts/toolchain-pins-gate.sh
      - run: docker build -t jitpack-ci .
      # A built image is not a served app: since ADR-043 the same container
      # answers the API and the client, and the one mistake that ships that
      # silently is a bundle that never reached /srv/web — the API stays green
      # and every browser gets a 404. So start it and ask for both.
      - name: The image serves the API and the app
        run: ./scripts/docker-smoke.sh jitpack-ci

  # Merges patch/minor Dependabot PRs once every check above is green.
  # `main` is protected and names go, go-lint, client, format and
  # docker-build as required, but `e2e` and `visual` deliberately are not
  # (an eight-leg matrix would need eight listed names, and a skipped
  # required check reports worse than the failure under it — see CLAUDE.md).
  # This job's `needs` is what makes a Dependabot merge wait for those too.
  # Major updates stay open for manual review.
  dependabot-merge:
    needs: [go, go-lint, client, format, visual, e2e, e2e-single, e2e-server, docker-build]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        id: metadata
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
