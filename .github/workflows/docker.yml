name: Docker

on:
  push:
    tags:
      - "v*"
  # release-please creates the tag with a PAT (see release.yml), so the tag
  # push above triggers this build directly. Kept for manual re-builds of an
  # existing tag.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Federates to AWS without a stored secret (ADR-102): the OIDC token
      # this grants is what configure-aws-credentials exchanges for the role.
      id-token: write

    # One release publishes one image: since ADR-043 the root Dockerfile
    # builds the client and the backend into a single container that serves
    # both on one origin. Its base images are pinned by digest (invariant 8).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # public.ecr.aws throttles anonymous pulls per shared runner IP (429
      # "Data limit exceeded", ADR-102); an authenticated pull gets its own
      # quota. The role trusts only this repo's OIDC token — see
      # dev-docs/ci.md for the AWS-side setup. Until the repo variable
      # exists, both steps are skipped and the pull stays anonymous (today's
      # behaviour), so a release tag pushed before that setup is not
      # hard-blocked.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: vars.AWS_ECR_PUBLIC_ROLE_ARN != ''
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLIC_ROLE_ARN }}
          # Amazon ECR Public is a single-region service; this is a fact
          # about AWS, not a per-deployment setting, so it is not a variable.
          aws-region: us-east-1
      - name: Log in to public ECR
        if: vars.AWS_ECR_PUBLIC_ROLE_ARN != ''
        run: |
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Names the build in the Settings "About" section (M17): the client
          # build stage has no `.git` to `git describe`/`rev-parse` itself
          # (see the Dockerfile comment), so the tag that triggered this run
          # and its commit are passed in explicitly.
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APP_COMMIT=${{ github.sha }}
