name: Docker

on:
  push:
    tags:
      - "v*"
  # release-please creates the tag with a PAT (see release.yml), so the tag
  # push above triggers this build directly. Kept for manual re-builds of an
  # existing tag.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # One release publishes two images from the same tag: the backend from
    # the repository root Dockerfile, and the SPA-plus-nginx client from
    # client/Dockerfile as <repo>-client. Both Dockerfiles pin their base
    # images by digest (invariant 8).
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: .
            suffix: ""
          - context: client
            suffix: "-client"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
