# Builds the MkDocs Material site from docs/ and deploys it to GitHub Pages.
#
# On pull requests the build job runs `mkdocs build --strict` as a gate, so a
# broken link or a page missing from the nav fails the PR instead of surfacing
# only after merge; the deploy job is push-to-main only.
#
# dev-docs/ is deliberately not part of the site — it is contributor material
# and is read on GitHub.
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"

# Allow the deploy job to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
          cache: pip
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      # Only the main-branch push needs to publish; PR runs stop at the strict
      # build above as a validation gate.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name == 'push'
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Never run two Pages deploys at once; let an in-flight one finish.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
