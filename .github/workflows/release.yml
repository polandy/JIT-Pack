# release-please reads the Conventional Commits history and maintains a
# release PR (CHANGELOG.md + next semver). Merging that PR creates the
# GitHub release and the v* tag.
#
# The version it releases from is `.release-please-manifest.json`, stated in
# the repository rather than derived from the tags, and release-please keeps it
# up to date itself. The reason is no longer that the tags are broken: the
# history was re-created on 2026-07-11 and all fifteen release tags stayed on
# the old line, which is how release-please came to propose `0.2.0` against a
# running `v0.9.0` — and on 2026-09-13 all fifteen were re-pointed onto `main`
# by hand, matched by tree identity. The reason is what that episode showed:
# **a tag is a movable label, and the repository had no other record of which
# version it had released.** The manifest is that record, and it cannot be
# silently invalidated by a force-push.
#
# It authenticates with a PAT (secrets.RELEASE_PLEASE_TOKEN) so the release
# PR and the release tag are raised by a real user: events from the default
# GITHUB_TOKEN never trigger other workflows, so with only GITHUB_TOKEN the
# release PR's CI stays gated and the tag push never reaches docker.yml.
# With the PAT, CI runs on the release PR and the tag push builds the image.
# Falls back to GITHUB_TOKEN when the secret is unset (release PR is still
# maintained, but its CI stays gated and no image is built on release).
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          # No `release-type` input: it belongs to the config file now, and the
          # two together are one place too many for the same decision.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
