version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    # Majors included, deliberately: a build-image major is also a toolchain
    # decision (golang here, node in /client), and letting Dependabot open the
    # PR is what makes it arrive without anyone remembering. It cannot merge
    # alone — scripts/toolchain-pins-gate.sh fails the docker-build job until
    # mise.toml, ci.yml and go.mod agree with it.
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    # client/Dockerfile — the SPA/nginx image published beside the backend.
    directory: /client
    schedule:
      interval: weekly
    ignore:
      # Odd-numbered Node majors never become LTS: they are Current for six
      # months and then end of life. Even majors do reach LTS (in the October
      # after their release), so they stay enabled and the toolchain-pins gate
      # decides when the repo is ready to move — see the root entry above.
      # Nothing is being remembered here: this only silences the half of the
      # release line that could never be taken.
      - dependency-name: node
        versions:
          - 25.x
          - 27.x
          - 29.x
          - 31.x
          - 33.x
  - package-ecosystem: pip
    # The docs toolchain (mkdocs-material + transitives, hash-pinned via
    # `uv pip compile --generate-hashes`, see docs/requirements.in).
    directory: /docs
    schedule:
      interval: weekly
