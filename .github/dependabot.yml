version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    # The docs toolchain (mkdocs-material + transitives, hash-pinned via
    # `uv pip compile --generate-hashes`, see docs/requirements.in).
    directory: /docs
    schedule:
      interval: weekly
