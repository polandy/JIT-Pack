# Local test stack for the full app (backend + UI) on a single origin.
#
# One container: since ADR-043 jitpackd serves the built client itself, so
# there is no reverse proxy to configure and the same-origin requirement the
# CORS-less API has is satisfied by there being only one server.
#
# Mode: Single-User (no OIDC, no IdP). The server bypasses auth and
# membership (FR-17.3); the client detects no OIDC (/auth/config → 501)
# and skips the login screen. So you "log in" simply by opening the app.
#
#   docker compose up --build      →  open http://localhost:3000
#   In the first-run screen pick "Server Mode" and enter:
#       http://localhost:3000
#
# The project and its container carry a `-dev` name so this stack can run
# beside a deployed JIT-Pack on the same host: container names are unique
# per daemon, and two compose projects sharing a name would treat each
# other's containers as orphans.

name: jitpack-dev

volumes:
  data:

services:
  app:
    build: .
    container_name: jitpack-dev-app
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "3000:8080"
    volumes:
      - data:/data
    environment:
      JITPACK_LISTEN: ":8080"
      JITPACK_DB_PATH: "/data/jitpack.db"
      JITPACK_SINGLE_USER: "true"
      JITPACK_LOCAL_USER_ID: "local"
