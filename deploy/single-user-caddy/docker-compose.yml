# One person, reachable from anywhere: JIT-Pack in Single-User Mode
# behind Caddy, which adds TLS and a password. Walkthrough:
# docs/easy-setup.md.

volumes:
  data:
  caddy-data:
  caddy-config:

services:
  caddy:
    image: caddy:2.11.6-alpine@sha256:c776e0c6413b544d0459665e54ec7b8b2a15000c0cbee8b254da0067b1d184ff
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      JITPACK_HOST: "${JITPACK_HOST:?set in .env}"
      BASIC_AUTH_USER: "${BASIC_AUTH_USER:?set in .env}"
      BASIC_AUTH_HASH: "${BASIC_AUTH_HASH:?set in .env}"

  app:
    image: ghcr.io/polandy/jit-pack:0.23.0 # x-release-please-version
    restart: unless-stopped
    volumes:
      - data:/data
    environment:
      JITPACK_DB_PATH: "/data/jitpack.db"
      JITPACK_SINGLE_USER: "true"
      JITPACK_LOCAL_USER_ID: "${BASIC_AUTH_USER}"
      TZ: "${TZ:-UTC}"
